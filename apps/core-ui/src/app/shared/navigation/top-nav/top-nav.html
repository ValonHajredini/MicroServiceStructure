<nav class="top-nav">
  <div class="nav-container">
    <div class="nav-left">
      <h2 class="company-name">{{ tenantName() }}</h2>
    </div>

    <div class="nav-right">
      <div class="user-section">
        <button
          #menuButton
          type="button"
          class="user-button"
          (click)="menu.toggle($event)">
          <p-avatar
            [label]="userInitials()"
            styleClass="user-avatar"
            shape="circle">
          </p-avatar>
          <div class="user-info">
            <span class="user-name">{{ userFullName() }}</span>
            <span class="user-email">{{ userEmail() }}</span>
          </div>
          <i class="pi pi-chevron-down"></i>
        </button>

        <p-menu
          #menu
          [model]="userMenuItems()"
          [popup]="true"
          appendTo="body">
        </p-menu>
      </div>
    </div>
  </div>
</nav>
