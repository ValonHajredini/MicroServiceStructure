<div class="user-menu-container">
  @if (buttonStyle === 'simple') {
    <!-- Simple button style (notes-ui) -->
    <p-button
      [label]="userEmailSignal()"
      icon="pi pi-user"
      [text]="true"
      [class]="buttonClass"
      (onClick)="op.toggle($event)"
      #menuButton>
    </p-button>
  } @else if (buttonStyle === 'avatar') {
    <!-- Avatar button style (core-ui) -->
    <button
      #menuButton
      type="button"
      class="user-button"
      [class]="buttonClass"
      (click)="op.toggle($event)">
      <p-avatar
        [label]="userInitialsSignal()"
        styleClass="user-avatar"
        shape="circle">
      </p-avatar>
      <div class="user-info">
        <span class="user-name">{{ userDisplayNameSignal() }}</span>
        <span class="user-email">{{ userEmailSignal() }}</span>
      </div>
      <i class="pi pi-chevron-down"></i>
    </button>
  }

  <p-popover #op [styleClass]="showShadow ? 'user-menu-popover user-menu-with-shadow' : 'user-menu-popover'">
    <div class="user-menu-content" [class.user-menu-content-shadow]="showShadow">
      <!-- User info header -->
      <div class="user-menu-header">
        <p-avatar
          [label]="userInitialsSignal()"
          styleClass="header-avatar"
          shape="circle">
        </p-avatar>
        <div class="header-info">
          <div class="header-name">{{ userDisplayNameSignal() }}</div>
          <div class="header-email">{{ userEmailSignal() }}</div>
        </div>
      </div>

      <!-- Menu items -->
      <div class="user-menu-items">
        @for (item of menuItemsSignal(); track $index) {
          @if (item.separator) {
            <div class="menu-separator"></div>
          } @else {
            <button
              type="button"
              class="menu-item"
              [class.disabled]="item.disabled"
              (click)="!item.disabled && onMenuItemClick(item, op)">
              @if (item.icon) {
                <i [class]="item.icon"></i>
              }
              <span class="menu-item-label">{{ item.label }}</span>
            </button>
          }
        }
      </div>
    </div>
  </p-popover>
</div>
