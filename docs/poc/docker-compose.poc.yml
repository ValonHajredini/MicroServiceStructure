version: '3.8'

services:
  # PostgreSQL for POC Phase
  postgres-poc:
    image: postgres:14
    container_name: postgres-poc
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poc_db
    ports:
      - "5432:5432"
    volumes:
      - poc-db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (optional - for database management UI)
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-poc
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-poc

volumes:
  poc-db-data:
    driver: local

networks:
  default:
    name: poc-network
