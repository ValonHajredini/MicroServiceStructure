# Detailed recommendations
recommendations:
  immediate:
    - action: "Add rate limiting middleware to /search endpoint"
      refs: ["apps/notes-api/src/notes/notes.controller.ts:59-73"]
      priority: "before-high-volume-production"
      estimated_effort: "2-4 hours"
      example: |
        import { ThrottlerGuard } from '@nestjs/throttler';
        @UseGuards(ThrottlerGuard)
        @Throttle(60, 60) // 60 requests per 60 seconds
        @Get('search')

