# Issues requiring attention before production
top_issues:
  - id: "SEC-001"
    severity: medium
    finding: "No audit logging for security-sensitive user management operations (role changes, user removals)"
    suggested_action: "Implement audit trail service to log all role changes and user removals with timestamp, admin user, and action details"
    suggested_owner: dev
    refs:
      - "apps/core-api/src/users/users.service.ts:22-76"
      - "apps/core-api/src/tenants/tenants.service.ts:201-255"
    impact: "Limits ability to investigate security incidents, user disputes, and compliance auditing"

  - id: "OPS-001"
    severity: medium
    finding: "No protection against removing last admin from tenant"
    suggested_action: "Add business rule validation to count admins before removal and prevent deletion if last admin"
    suggested_owner: dev
    refs:
      - "apps/core-api/src/tenants/tenants.service.ts:201"
    impact: "Risk of organization lockout if last admin is accidentally removed"

  - id: "UX-001"
    severity: low
    finding: "Frontend uses browser alert() and confirm() dialogs instead of Angular Material components"
    suggested_action: "Replace with Angular Material Dialog/Snackbar for consistency and better testability"
    suggested_owner: dev
    refs:
      - "apps/core-ui/src/app/features/admin/team-management/team-management.ts:136"
      - "apps/core-ui/src/app/features/admin/team-management/team-management.ts:203"
      - "apps/core-ui/src/app/features/admin/team-management/team-management.ts:237"
    impact: "UX inconsistency and reduced testability"

  - id: "UX-002"
    severity: low
    finding: "Invite button navigates to separate page instead of opening modal (AC 5 expectation)"
    suggested_action: "Convert to modal dialog for consistency with design expectations"
    suggested_owner: dev
    refs:
      - "apps/core-ui/src/app/features/admin/team-management/team-management.ts:194-198"
    impact: "Minor UX expectation mismatch"

