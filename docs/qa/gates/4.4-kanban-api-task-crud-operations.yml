# Quality Gate: Story 4.4 - Kanban API Task CRUD Operations
schema: 1
story: "4.4"
story_title: "Kanban API - Task CRUD Operations"
gate: CONCERNS
status_reason: "Functionally complete with excellent test coverage (16 unit + 29 e2e tests), but missing critical authorization check for task movement operation (AUTH-001)."
reviewer: "Quinn (Test Architect)"
updated: "2025-01-30T15:00:00Z"

# Critical gap identified
top_issues:
  - id: "AUTH-001"
    severity: high
    finding: "Missing authorization check in moveTask operation"
    details: "The PATCH /tasks/:id/move endpoint and TasksService.moveTask() method do not verify user authorization before allowing task movement. According to AC 7, only task assignee, board owner, or tenant admin should be able to modify tasks. Moving a task is a modification operation (updates column_id and position)."
    suggested_action: "Add authorization check to moveTask() method verifying user is assignee, board owner, or admin. Update controller endpoint to include @CurrentUser() and @Roles() decorators. Add e2e test for unauthorized move attempt."
    refs:
      - "apps/kanban-api/src/tasks/tasks.service.ts:184-249 (moveTask method)"
      - "apps/kanban-api/src/tasks/tasks.controller.ts:63-75 (moveTask endpoint)"
      - "docs/stories/4.4.story.md:34 (AC 7)"
    suggested_owner: "dev"

  - id: "MAINT-001"
    severity: low
    finding: "Duplicate authorization logic across methods"
    details: "Authorization pattern (assignee OR board owner OR admin) is duplicated in update(), remove(), and should be in moveTask(). Consider extracting to shared helper method for DRY principle."
    suggested_action: "Extract authorization check to private helper method (e.g., canModifyTask()) for reuse across update, remove, and moveTask methods."
    refs:
      - "apps/kanban-api/src/tasks/tasks.service.ts:98-112 (update authorization)"
      - "apps/kanban-api/src/tasks/tasks.service.ts:163-177 (remove authorization)"
    suggested_owner: "dev"

  - id: "VAL-001"
    severity: low
    finding: "Missing validation for moveTask request body"
    details: "PATCH /tasks/:id/move endpoint accepts body with columnId and position but no validation decorators are applied. Should validate columnId is UUID and position is number."
    suggested_action: "Create MoveTaskDto with @IsUUID() and @IsNumber() decorators, or add inline validation to ensure data integrity."
    refs:
      - "apps/kanban-api/src/tasks/tasks.controller.ts:66 (moveTask body parameter)"
    suggested_owner: "dev"

waiver: { active: false }

