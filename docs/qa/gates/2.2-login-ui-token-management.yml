      priority: low
      notes: "Current per-IP rate limiting is sufficient for MVP. Per-email limiting would add defense against distributed attacks."
    - action: "Evaluate httpOnly cookies vs localStorage for enhanced XSS protection"
      refs: ["apps/core-ui/src/app/core/services/auth.service.ts:34-36"]
      priority: low
      notes: "Consistent with Story 2.1. localStorage acceptable for MVP. httpOnly cookies provide better XSS protection but require CORS configuration changes."

